<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f1a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<title>Atelier Meubles</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#faf7f1;--ink:#1f1a14;--mute:#7a6e60;--line:#e2d6c2;--pine:#e0b47c;--pine-d:#6b4a2b;--acc:#d9480f;--guide:#0b8a96;--dim:#24506e;--card:#fffdf9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:nowrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#cbb796}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:#b42318}
.btn:disabled{opacity:.35}
#name{color:var(--ink);flex:1;min-width:60px;font-weight:700;font-size:15px;border:none;background:transparent;padding:6px;border-radius:6px;text-overflow:ellipsis}
#name:focus{outline:2px solid var(--line);background:#fff}
#status{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#tools{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:var(--card);justify-content:center;flex-wrap:wrap}
#tools .btn{padding:8px 12px}
.ico{font-weight:800;font-size:15px;line-height:1}
#panel{position:absolute;right:38px;bottom:38px;width:290px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(60,40,10,.14);padding:12px;display:none;max-height:calc(100% - 50px);overflow:auto}
#panel h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;font-size:11px;color:var(--mute);gap:3px}
label.f input,label.f select{font:600 15px/1 inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
label.f input:disabled{background:#f1ece3;color:#8a7b64;border-style:dashed}
.seg button:disabled{opacity:.4}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 12px}
.seg button.on{background:var(--ink);color:#fff}
#hint{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--mute);pointer-events:none;max-width:340px;font-size:14px;line-height:1.5}
#hint b{color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(30,20,10,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal .box{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h2{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.tag{display:inline-block;min-width:26px;text-align:center;background:var(--pine);border:1px solid var(--pine-d);border-radius:6px;font-weight:800;padding:1px 5px}
.bar{display:flex;height:34px;border:1px solid var(--pine-d);border-radius:4px;overflow:hidden;margin:4px 0 10px;background:repeating-linear-gradient(45deg,#eee,#eee 4px,#f8f8f8 4px,#f8f8f8 8px)}
.bar div{background:var(--pine);border-right:2px solid var(--pine-d);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap}
.sec{margin:16px 0 6px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.big{font-size:20px;font-weight:800}
.list .it{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.list .it .n{flex:1;font-weight:700}
.list .it small{color:var(--mute);font-weight:400;display:block}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#2a241d;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:none;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
#kp .in{max-width:460px;margin:0 auto}
#kp .kpd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;color:#cdbfa8;padding:2px 6px 8px;font-size:12px}
#kp .kpd b{color:#fff;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kp .kpd i{color:#f4c48c;font-style:normal;font-size:14px;font-weight:700}
#kp .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#kp button{height:52px;border:none;border-radius:11px;background:#3d352b;color:#fff;font:700 22px -apple-system,Segoe UI,sans-serif;touch-action:manipulation}
#kp button:active{background:#5a4e3f}
#kp button.op{background:#4c4236;color:#f4c48c}
#kp button.ok{background:var(--acc)}
#kp button.sm{font-size:17px}
input.kpOn{outline:3px solid var(--acc)!important}
#buildMenu{position:fixed;z-index:22;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(60,40,10,.22);padding:8px;display:none;grid-template-columns:repeat(4,1fr);gap:6px;width:min(400px,calc(100vw - 16px))}
#buildMenu button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:12px;line-height:1.15;text-align:center;color:var(--ink)}
#buildMenu button .bi{font-size:22px;line-height:1}
#buildMenu button.on{background:#fde3d3;border-color:var(--acc)}
#eyeMenu{position:fixed;z-index:22;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(60,40,10,.2);padding:6px;display:none;min-width:230px}
#eyeMenu button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:11px 10px;border-radius:9px;font-size:15px;text-align:left}
#eyeMenu button:active{background:#f3ead9}
#eyeMenu .sw{margin-left:auto;width:40px;height:24px;border-radius:12px;background:#d8ccb8;position:relative;flex:none;transition:background .15s}
#eyeMenu .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
#eyeMenu .on .sw{background:var(--acc)}
#eyeMenu .on .sw::after{left:19px}
#toast{z-index:40!important;position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.lbl-m{display:none}
#room{position:fixed;inset:0;background:#141210;display:none;flex-direction:column;z-index:15}
#room .rbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line)}
#room .rbar b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rStage{position:relative;flex:1;min-height:0}
#rcv{position:absolute;inset:0;touch-action:none;display:block}
#rPanel{background:var(--card);padding:10px 12px;border-top:1px solid var(--line);max-height:44%;overflow:auto}
#rPanel p{margin:0 0 8px;color:var(--mute);font-size:13px;line-height:1.45}
#rPanel p b{color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px}
@media (max-width:720px){
  .lbl-d{display:none}.lbl-m{display:inline}
  #panel{left:34px;right:34px;width:auto;bottom:34px;max-height:42%;padding:9px;border-radius:12px}
  #panel h3{margin-bottom:6px}
  #panel .grid2{grid-template-columns:1fr 1fr 1fr;gap:6px}
  #panel label.f input{padding:6px;font-size:14px}
  #panel .row{margin-top:7px;gap:5px}
  #panel .row .btn{padding:6px 8px;font-size:12px}
  #status{display:none}
  header{gap:4px;padding:6px}
  header .btn{padding:7px 8px}
  #tools{gap:4px;padding:6px 5px}
  #tools .btn{flex:1;min-width:0;justify-content:center;padding:8px 2px;font-size:11px;flex-direction:column;gap:2px;overflow:hidden}
}
</style>

<body>
<div id="app">
  <header>
    <button class="btn" id="bMenu" title="Mes meubles">☰</button>
    <input id="name" value="Nouveau meuble" aria-label="Nom du meuble">
    <span id="status"></span>
    <button class="btn" id="bUndo" title="Annuler (Ctrl+Z)"><span class="ico" style="font-size:18px">↶</span><span class="lbl-d">Annuler</span></button>
    <button class="btn" id="bRedo" title="Rétablir (Ctrl+Y)"><span class="ico" style="font-size:18px">↷</span></button>
    <button class="btn" id="bEye" title="Afficher / cacher" style="position:relative"><span class="ico" style="font-size:17px">👁</span><span class="lbl-d">Affichage</span><i id="eyeDot" style="display:none;position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--acc)"></i></button>
    <button class="btn" id="b3D" title="Voir en 3D"><span class="ico" style="font-size:13px">3D</span></button>
    <button class="btn pri" id="bDebit">Débit<span class="lbl-d"> &amp; PDF</span></button>
    <button class="btn" id="bSet" title="Réglages">⚙</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"><b>Glisse depuis un bord gradué</b> : haut ou bas pour une règle horizontale, gauche ou droite pour une règle verticale. Bouge lentement pour régler au millimètre.<br>Choisis <b>Caisson</b> et trace un rectangle, ou <b>Planche</b> et trace une planche.<br>Tout s'aimante aux règles et aux planches.</div>
    <div id="panel"></div>
  </div>
  <div id="tools">
    <button class="btn on" data-tool="sel"><span class="ico">➚</span><span><span class="lbl-d">Sélection</span><span class="lbl-m">Choix</span></span></button>
    <button class="btn" id="bBuild"><span class="ico">🔨</span><span class="bl">Construire</span></button>
    <button class="btn" data-tool="dim"><span class="ico">📏</span><span>Cote</span></button>
    <button class="btn" data-tool="book"><span class="ico">📚</span><span>Déco</span></button>
    <button class="btn" id="bRoom"><span class="ico">📷</span><span>Pièce</span></button>
    <button class="btn" id="bFit"><span class="ico">⤢</span><span>Vue</span></button>
  </div>
</div>
<div id="v3d" style="position:fixed;inset:0;background:#f3eee6;display:none;flex-direction:column;z-index:15">
  <div class="rbar" style="display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line)"><button class="btn" id="v3Back">← Plan</button><b style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">3D · <span id="v3Count"></span></b><button class="btn on" id="v3Screw">🔩<span class="lbl-d"> Vis</span></button></div>
  <div class="row" style="margin:0;padding:6px 8px;gap:5px;background:var(--card);border-bottom:1px solid var(--line)"><button class="btn" data-v3="face">Face</button><button class="btn" data-v3="34">¾</button><button class="btn" data-v3="side">Côté</button><button class="btn" data-v3="top">Dessus</button></div>
  <div id="v3stage" style="position:relative;flex:1;min-height:0"><canvas id="c3d" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block"></canvas><div id="v3dMsg" style="position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:var(--mute);text-align:center"></div></div>
  <div id="p3d" style="background:var(--card);padding:10px 12px;border-top:1px solid var(--line)"></div>
</div>
<div id="room">
  <div class="rbar"><button class="btn" id="rBack">← Plan</button><b id="rTitle">Dans ma pièce</b><button class="btn pri" id="rSave">⬇ Image</button></div>
  <div id="rStage"><canvas id="rcv"></canvas></div>
  <div id="rPanel"></div>
  <input type="file" id="rCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="rLib" accept="image/*" hidden>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="eyeMenu"></div>
<div id="buildMenu"></div>
<div id="kp"><div class="in"><div class="kpd"><span id="kpL"></span><span><i id="kpR"></i> <b id="kpV"></b></span></div><div class="g" id="kpG"></div></div></div>
<script>
"use strict";
// ---------- Modèle ----------
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const DEF_SETTINGS = { t: 18, d: 200, stock: 2000, assembly: 'top', screwsPerJoint: 2, screwType: '4 × 40 mm', showGaps: true };
function newDesign() { return { id: uid(), name: 'Nouveau meuble', boards: [], guides: [], books: [], objs: [], dims: {}, cdims: [], screws: {}, parts: [], settings: { ...DEF_SETTINGS }, updatedAt: Date.now() }; }
let D = newDesign();
let sel = new Set();
let tool = 'sel';
const undoS = [], redoS = [];

const S = () => D.settings;
const vis = k => D.settings[k] !== false; // showGaps (cotes), showGuides (règles), showBooks (livres), showCross (croix)
const bw = b => b.o === 'h' ? b.L : b.t;
const bh = b => b.o === 'h' ? b.t : b.L;
const rect = b => ({ x0: b.x, y0: b.y, x1: b.x + bw(b), y1: b.y + bh(b) });
const depth = b => b.d || S().d;
const byId = id => D.boards.find(b => b.id === id);

function fmt(mm) { return (Math.round(mm) / 10).toFixed(1).replace('.', ','); }
function parseCm(str) {
  const s = String(str).replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\s/g, '');
  if (!/^[0-9.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return(' + s + ')')(); return Number.isFinite(v) ? Math.round(v * 10) : NaN; } catch { return NaN; }
}
function snapshot() { return JSON.stringify({ boards: D.boards, guides: D.guides, books: D.books, dims: D.dims, cdims: D.cdims, objs: D.objs, screws: D.screws, parts: D.parts || [], settings: D.settings }); }

// Volumes des éléments de construction pour la 3D et la RA : [x0, y0, z0, x1, y1, z1, matière, forme]
function partBoxes() {
  const out = [], t = S().t;
  for (const p of parts('dos')) { const o = outerRect(p.a), e = p.mat === 'pin' ? t : (p.ep || 5); out.push([o.x0, o.y0, -e, o.x1, o.y1, 0, p.mat === 'pin' ? 'w' : '#cfb489']); }
  for (const p of parts('tasseau')) { const g = cleatGeom(p); out.push([g.x0, g.y0, 0, g.x1, g.y1, g.L, '#c99a62']); }
  for (const p of parts('pied')) {
    const g = legGeom(p), d = depth(byId(p.b)), zs = p.pair === false ? [d / 2] : [d - p.ins - g.w / 2, p.ins + g.w / 2], col = p.src === 'pin' ? 'w' : p.shape === 'epingle' ? '#2a2a2a' : '#c8955a';
    const shape = p.src === 'pin' ? 'box' : p.shape === 'rond' ? 'cyl' : p.shape === 'compas' ? 'cone' : p.shape === 'epingle' ? 'pin' : 'box';
    for (const z of zs) out.push([g.cx - g.w / 2, g.bot, z - g.w / 2, g.cx + g.w / 2, g.top, z + g.w / 2, col, shape]);
  }
  if (vis('showFronts')) for (const p of parts().filter(p => p.k === 'porte' || p.k === 'tiroir')) {
    const d = depth(byId(p.a.b)), z0 = p.mount === 'enc' ? d - t : d;
    for (const f of fronts(p)) out.push([f.x0, f.y0, z0, f.x1, f.y1, z0 + t, 'w', p.k, f.hinge]);
  }
  return out;
}
// ---------- Réalité augmentée : le meuble part vers la page « chez moi » dans le lien lui-même ----------
const AR_DEFAULT = 'https://solaltoumayan.github.io/atelier-ar/';
const arBase = () => { try { return localStorage.getItem('atelier.arBase') || AR_DEFAULT; } catch { return AR_DEFAULT; } };
async function arPayload() {
  const r1 = v => Math.round(v * 10) / 10, M = { n: D.name, b: D.boards.map(b => [r1(b.x), r1(b.y), r1(bw(b)), r1(bh(b)), r1(depth(b)), b.o]), k: [], o: [] };
  if (vis('showBooks')) for (const k of D.books) { const f = BOOKS[k.f] || BOOKS.roman, n = bookCount(k), sh = shelfUnder(k), dd = sh ? depth(sh) : S().d, z1 = Math.max(dd, f.p); for (let i = 0; i < n; i++) { const hh = k.h * (1 - f.v * rng(k.seed, i)); M.k.push([r1(k.x + i * k.e), r1(k.y), r1(k.e - .6), r1(hh), r1(z1 - f.p), r1(z1), f.manga ? '#f7f5ef' : f.pal[Math.floor(rng(k.seed + 7, i) * f.pal.length)]]); } }
  if (vis('showObjs')) for (const o of D.objs) M.o.push([o.t, r1(o.x), r1(o.y), r1(o.h), r1(S().d / 2)]);
  M.p = partBoxes().map(q => [...q.slice(0, 6).map(r1), q[6], q[7] || 'box']);
  const z = await new Response(new Blob([JSON.stringify(M)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  let bin = ''; new Uint8Array(z).forEach(c => bin += String.fromCharCode(c)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
